[package]
name = "cabrik-fenster"
description = "Die Fensterhuelle. Duenn mit Absicht -- alles Entscheidende steht in cabrik-app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LicenseRef-Cabrik-Proprietary"
publish = false
repository.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [] }
# Fuer die Frischewache im Bauskript: Sie liest `frontendDist` aus
# `tauri.conf.json`, statt den Pfad ein zweites Mal festzuschreiben.
serde_json.workspace = true

[dependencies]
cabrik-ablage.workspace = true
cabrik-app.workspace = true
cabrik-bruecke.workspace = true
cabrik-core.workspace = true
# Fuer die Wege ohne ganze Datei (spec/grosse-dateien.md §5, §13): die
# Erkennung am Anfang und das Geruest. Beide brauchen die Datei, und die
# liest nur das Fenster.
cabrik-metadata.workspace = true
serde.workspace = true
cabrik-shred.workspace = true
cabrik-speicher.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
rfd.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Nur fuer die Lesetests: Der Kanal liefert den serialisierten Leib, und
# ihn dort wieder zu lesen prueft nebenbei, dass `Fortschritt` ueber die
# Bruecke ueberhaupt geht.
serde_json.workspace = true

[lints]
workspace = true
