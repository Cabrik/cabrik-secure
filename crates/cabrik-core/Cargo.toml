[package]
name = "cabrik-core"
description = "Kryptographischer Kern von Cabrik Secure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
sha2.workspace = true
hkdf.workspace = true
thiserror.workspace = true
zeroize.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
chacha20 = { workspace = true, optional = true }
hpke.workspace = true
rand_core.workspace = true
ed25519-dalek.workspace = true
x-wing = "0.1.0"
subtle = "2.6.1"
hybrid-array = "0.4.14"
shake = "0.1.0"

[dev-dependencies]
ed25519-dalek.workspace = true
serde_json.workspace = true
# Diese Kiste auf sich selbst, nur mit dem Merkmal `testing`.
#
# Sieht seltsam aus und ist der uebliche Weg: Cargo baut die Kiste fuer
# Tests dann MIT der deterministischen Zufallsquelle, ohne sie in den
# Auslieferungsstand zu ziehen. Ohne diesen Eintrag braeuchte
# `tests/formatfreeze.rs` ein `--features testing` beim Aufruf -- und
# `cargo test --workspace` in der CI liefe darauf auf, ohne dass jemand
# den Grund saehe.
cabrik-core = { path = ".", features = ["testing"] }

[lints]
workspace = true

[features]
# Deterministische Zufallsquelle für bit-genaue Verschlüsselungsvektoren
# (spec/test-vectors.md §3.1).
#
# NIEMALS im Release aktivieren. Ohne dieses Feature existiert der Typ
# `rng::testing::DeterministicRng` nicht — das ist keine Laufzeitprüfung,
# sondern vom Übersetzer garantiert.
testing = ["dep:chacha20"]
