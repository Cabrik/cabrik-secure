[package]
name = "cabrik-core"
description = "Kryptographischer Kern von Cabrik Secure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
hkdf.workspace = true
thiserror.workspace = true
zeroize.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
chacha20 = { workspace = true, optional = true }
hpke = "0.14.0"
rand_core = "0.10"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[features]
# Deterministische Zufallsquelle für bit-genaue Verschlüsselungsvektoren
# (spec/test-vectors.md §3.1).
#
# NIEMALS im Release aktivieren. Ohne dieses Feature existiert der Typ
# `rng::testing::DeterministicRng` nicht — das ist keine Laufzeitprüfung,
# sondern vom Übersetzer garantiert.
testing = ["dep:chacha20"]
