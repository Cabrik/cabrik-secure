# Fuzzing — nachts, nicht bei jedem Push.
#
# # Warum getrennt vom Tor
#
# Weil Fuzzing zwei verschiedene Dinge tut, und nur eines davon gehört in
# einen Lauf, auf den jemand wartet:
#
# 1. **Neues finden.** Das braucht Minuten bis Stunden und lohnt sich pro
#    Lauf selten. Es steht hier.
# 2. **Gefundenes festhalten.** Was das Fuzzing je zutage gefördert hat,
#    liegt unter `testvectors/fuzz/<ziel>/` und wird von den Korpus-Tests
#    der Hauptwerkbank bei **jedem** `cargo test` erneut durchgespielt.
#    Das steht im Tor und kostet nichts.
#
# Fuzzing findet, der Korpus hält fest. Nur der erste Teil braucht Zeit.
#
# # Warum eine eigene Werkbank
#
# `cargo fuzz` baut mit nightly und mit Adressprüfer; die Hauptwerkbank ist
# auf 1.97.1 festgenagelt. Beides in einem Baum unterzubringen hieße, die
# Festlegung aufzuweichen — und die gibt es, damit Builds überall gleich
# ausfallen.

name: Fuzzing

on:
  schedule:
    # Nachts um 3 Uhr UTC. Niemand wartet darauf.
    - cron: "0 3 * * *"
  # Und von Hand, wenn jemand an den Zielen gearbeitet hat.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzzen:
    name: ${{ matrix.ziel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ziel:
          - envelope_open
          - envelope_open_passwort
          - metadata_inspect
          - metadata_strip
          - v1_open

    steps:
      - uses: actions/checkout@v4

      # Nightly nur hier, nicht im Tor.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.ziel }}

      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Zehn Minuten je Ziel. Das ist kurz für Fuzzing -- aber es läuft
      # jede Nacht, und was einmal gefunden wurde, bleibt über den Korpus
      # dauerhaft geprüft.
      - name: Lauf
        run: cargo fuzz run ${{ matrix.ziel }} -- -max_total_time=600

      # Ein Fund ist der Zweck dieses Ablaufs, nicht sein Fehlschlag. Er
      # muss aus dem Lauf herauskommen, damit er in `testvectors/fuzz/`
      # landen kann.
      - name: Fundstücke sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fund-${{ matrix.ziel }}
          path: fuzz/artifacts/${{ matrix.ziel }}/
          if-no-files-found: ignore
