# Fuzzing — hier und nur hier.
#
# WARUM AUF LINUX. `cargo fuzz` braucht libFuzzer und die Laufzeit des
# Adressprüfers. Auf dem Entwicklungsrechner unter Windows **bauen** die
# Ziele einwandfrei, **starten** aber nicht: Es fehlt
# `clang_rt.asan_dynamic-x86_64.dll`, ein optionaler
# Visual-Studio-Bestandteil. Auf Linux ist das ohne Zutun vorhanden.
#
# WARUM NACH PLAN UND NICHT BEI JEDEM PUSH. Fuzzing ist keine Prüfung mit
# Ja-oder-Nein-Ergebnis, sondern eine Suche. Fünf Minuten je Ziel bei jedem
# Push fänden fast nie etwas und kosteten jeden Beitrag Zeit. Einmal pro
# Nacht mit ordentlicher Laufzeit findet mehr.
#
# WAS GEFUNDEN WIRD, GEHÖRT FESTGEHALTEN. Meldet ein Ziel einen Absturz,
# hängt dieser Lauf die auslösende Datei als Artefakt an. Sie gehört
# **vor der Fehlerbehebung** nach `testvectors/fuzz/<ziel>/` — dort prüfen
# die Korpus-Tests sie bei jedem `cargo test` erneut, auf stable und ohne
# Sonderwerkzeug. Fuzzing findet, der Korpus hält fest.

name: Fuzzing

on:
  workflow_dispatch:
    inputs:
      dauer:
        description: Sekunden je Ziel
        default: "300"
  schedule:
    # Nachts um drei, wenn niemand auf ein Ergebnis wartet.
    - cron: "0 3 * * *"

jobs:
  fuzzing:
    name: ${{ matrix.ziel }}
    runs-on: ubuntu-latest
    strategy:
      # Ein Absturz in einem Ziel soll die anderen nicht abbrechen — sonst
      # bliebe unbekannt, ob es einer oder fünf sind.
      fail-fast: false
      matrix:
        ziel:
          - envelope_open
          - envelope_open_passwort
          - metadata_inspect
          - metadata_strip
          - v1_open

    steps:
      - uses: actions/checkout@v4

      - name: Nightly-Toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rust-src

      - name: cargo-fuzz zwischenspeichern
        id: speicher
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-v1

      - name: cargo-fuzz bauen
        if: steps.speicher.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      # Der Startkorpus liegt im Verzeichnis. Ohne ihn verbrächte der Fuzzer
      # Stunden damit, überhaupt einen gültigen Kopf zu erraten.
      - name: Startkorpus bereitstellen
        run: |
          ziel="${{ matrix.ziel }}"
          case "$ziel" in
            envelope_open*|v1_open) quelle=testvectors/fuzz/envelope ;;
            metadata_*)             quelle=testvectors/fuzz/metadata ;;
          esac
          mkdir -p "fuzz/corpus/$ziel"
          [ -d "$quelle" ] && cp -n "$quelle"/* "fuzz/corpus/$ziel/" || true
          echo "Startkorpus: $(ls -1 "fuzz/corpus/$ziel" | wc -l) Datei(en)"

      - name: Fuzzing
        run: |
          cargo +nightly fuzz run "${{ matrix.ziel }}" -- \
            -max_total_time=${{ github.event.inputs.dauer || 300 }} \
            -max_len=1048576 \
            -print_final_stats=1

      # Nur wenn etwas gefunden wurde. Die Datei ist der eigentliche Wert
      # des Laufs — ohne sie ist der Fund nicht nachstellbar.
      - name: Gefundene Eingaben sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: absturz-${{ matrix.ziel }}
          path: fuzz/artifacts/${{ matrix.ziel }}/
          if-no-files-found: ignore
