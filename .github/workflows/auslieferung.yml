# Baut die Installer auf einem fremden Rechner — und legt sie zum Abholen ab.
#
# # Warum das nicht im Gatter steht
#
# Weil ein Tauri-Release mehrere Minuten braucht und bei jedem Push nichts
# beantworten würde, was `pruefung.yml` nicht schon beantwortet. Dieser
# Ablauf wird von Hand angestoßen oder von einer Marke ausgelöst.
#
# # Was er beantwortet, was hier niemand beantworten kann
#
# **Erstens: baut es ohne diese eine Maschine?** Der Installer ist bisher
# nur auf dem Entwicklungsrechner entstanden. Ein Bau, der nur dort läuft,
# ist kein Bau, sondern ein Zufall.
#
# **Zweitens: liegt das NSIS-Problem wirklich am Virenwächter?** Auf dem
# Entwicklungsrechner bricht das NSIS-Bündeln ab — `Can't open output
# file` für `nsis-output.exe`, und der Verdacht steht auf F-Secure
# (`docs/verlauf.md`, 5.3). Der Läufer hier hat kein F-Secure. Läuft NSIS
# durch, war die Diagnose richtig; scheitert es auch hier, war sie falsch
# und die Ursache liegt im Projekt.
#
# **Drittens: die Prüfsummen.** 5.3 verlangt veröffentlichte Summen, damit
# jeder abgleichen kann, dass sein Download dem entspricht, was die CI
# gebaut hat. Von Hand auf dem eigenen Rechner erzeugte Summen leisten das
# nicht — sie bezeugen nur, dass die Datei die ist, die man selbst gebaut
# hat.
#
# # Signiert wird hier nicht
#
# Es gibt kein Zertifikat (siehe `docs/signatur.md`). Die Bündel sind
# unsigniert, und das steht in ihrem Namen. Wenn ein Zertifikat da ist,
# kommen zwei Geheimnisse dazu und der Bauschritt bleibt, wie er ist —
# `auslieferung.ps1` liest sie aus der Umgebung.
#
# # Und macOS und Linux (seit 26.10.2026)
#
# Für die Alpha unter Kollegen und Freunden, von denen nicht alle Windows
# haben. Bis dahin war auf beiden Systemen nur GEPRÜFT worden
# (`pruefung.yml`), nie ein Programm entstanden, das jemand starten kann.
# Ob das Bündeln dort durchläuft, ist eine eigene Frage — dieselbe wie
# „Erstens“ oben, nur für zwei weitere Systeme.
#
# Unsigniert heißt dort mehr als unter Windows: macOS startet ein nicht
# notarisiertes Programm aus dem Netz erst nach einem Umweg über die
# Systemeinstellungen. Für eine Alpha reicht das, für mehr nicht.
#
# Und selbst diesen Umweg gibt es nur für ein versiegeltes Bündel. Auf
# Rechnern mit Apple-Chip verlangt macOS für jedes Programm aus dem Netz
# eine Signatur; ohne sie gilt das Programm als beschädigt, und es gibt
# keinen Knopf, es trotzdem zu öffnen. Bis zum 27.10.2026 signierte das
# Bündeln hier gar nicht. Seitdem signiert es ad hoc
# (`"signingIdentity": "-"` in `tauri.conf.json`): ohne Zertifikat, ohne
# Herausgeber, aber versiegelt. „unsigniert“ im Namen der Ablage bleibt
# richtig — für die Datei bürgt niemand.
#
# Quelle: https://v2.tauri.app/distribute/sign/macos/ („Ad-Hoc Signing“).
# Auf einem echten Mac gesehen hat das noch niemand (`docs/ROADMAP.md`,
# Alpha, Schritt 1).

name: Auslieferung

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Die Fassung des Tauri-Werkzeugs -- GENAU, nicht als Bereich, und an
# dieser einen Stelle. Zwei Gruende:
#
# 1. Der Zwischenspeicher fuer das Werkzeug haengt an ihr. Stand hier
#    "~2.12", bekam jeder Lauf das Werkzeug aus dem Speicher, das beim
#    ERSTEN Lauf das neueste war; ein spaeterer 2.12-Patch kam nie an.
# 2. `.github/skripte/tauri_meldungen.py` liest sie und prueft sie gegen
#    Tauris Sicherheitsmeldungen. Einen Bereich koennte es nicht pruefen.
#
# Sie folgt der Kiste `tauri` (Wurzel-`Cargo.toml`): Wer dort die
# Nebenfassung anhebt, hebt sie hier mit an.
env:
  TAURI_CLI: "2.12.4"

jobs:
  installer:
    name: Installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/oberflaeche/.nvmrc
          cache: npm
          cache-dependency-path: app/oberflaeche/package-lock.json

      - name: Toolchain
        shell: bash
        run: |
          kanal=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Festgelegt: $kanal"
          rustup toolchain install "$kanal" --profile minimal
          rustup default "$kanal"
          rustc --version

      - name: Zwischenspeicher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/release/bundle
          # Ohne die fertigen Buendel: Sie gehoeren zu dem Lauf, der sie
          # gebaut hat, und kaemen sonst im naechsten wieder zum Vorschein
          # (Buendel-Aufgabe unten, 28.10.2026).
          #
          # Eigener Schluessel: Dieser Ablauf baut im Release-Profil, das
          # Gatter im Dev-Profil. Ein gemeinsamer Zwischenspeicher truege
          # beide Saetze und liefe demselben Platzproblem entgegen, an dem
          # der Linux-Laeufer schon einmal zerbrochen ist.
          key: ${{ runner.os }}-auslieferung-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-auslieferung-v1-

      # Das Tauri-Werkzeug wird gebaut, nicht heruntergeladen -- dasselbe
      # Muster wie bei `cargo-deny` in `abhaengigkeiten.yml`: eine fremde
      # Action weniger, und die Fassung ergibt sich aus der Registrierung.
      #
      # Es dauert einige Minuten, deshalb der eigene Zwischenspeicher.
      #
      # Welche Fassung: `TAURI_CLI` oben. Der Schluessel haengt an ihr --
      # wer sie aendert, bekommt beim naechsten Lauf das neue Werkzeug,
      # ohne an den Speicher denken zu muessen.
      - name: Tauri-Werkzeug zwischenspeichern
        id: werkzeug
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI }}

      - name: Tauri-Werkzeug bauen
        if: steps.werkzeug.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "=${{ env.TAURI_CLI }}"

      - name: Fassungen
        shell: bash
        run: |
          cargo tauri --version
          node --version

      - name: Abhängigkeiten der Oberfläche
        working-directory: app/oberflaeche
        run: npm ci

      - name: Freier Platz
        shell: bash
        run: df -h . | tail -1

      # Genau das Skript, das auch auf dem Entwicklungsrechner gilt. Ohne
      # `-Buendel` baut es beide Ziele -- hier ist das Absicht: Der Lauf
      # SOLL an NSIS scheitern duerfen, denn genau das ist die Frage.
      - name: Installer bauen
        shell: pwsh
        run: .\auslieferung.ps1

      # Die Bündel zum Abholen. `actions/upload-artifact` ist von GitHub
      # selbst, wie `checkout`, `cache` und `setup-node`.
      #
      # WOZU. Der offene Punkt in 5.3 ist nicht das Bauen, sondern das
      # Prüfen auf einem frischen Windows -- ohne WebView2, ohne Rust, ohne
      # Node. Dafür muss jemand die Datei herunterladen können, ohne sie
      # selbst zu bauen.
      - name: Bündel ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cabrik-secure-installer-unsigniert
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/pruefsummen.txt
          if-no-files-found: error
          retention-days: 14

  # macOS und Linux. Ohne das Skript: `auslieferung.ps1` ist auf MSI, NSIS
  # und Authenticode gebaut, und davon gibt es hier nichts. Der Bau ist ein
  # einziger Aufruf; die Prüfsummen entstehen gleich daneben.
  buendel:
    name: Bündel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Scheitert eines, soll das andere trotzdem fertig werden -- sonst
      # bliebe offen, ob es eines ist oder beide.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            # `deb` für Debian und Ubuntu, `appimage` für alles andere: Es
            # läuft ohne Installation, und genau das braucht eine Alpha.
            buendel: deb,appimage
          - os: macos-latest
            name: macOS
            # Das `.app` steckt im Abbild; abgelegt wird nur das `.dmg`.
            buendel: app,dmg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dieselbe Liste wie im Gatter (`pruefung.yml`), dazu `libfuse2t64`:
      # Das AppImage-Werkzeug startet sich selbst als AppImage und braucht
      # dafür FUSE 2, das Ubuntu seit 24.04 nicht mehr von sich aus
      # mitbringt.
      - name: Systempakete (nur Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            libfuse2t64

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/oberflaeche/.nvmrc
          cache: npm
          cache-dependency-path: app/oberflaeche/package-lock.json

      - name: Toolchain
        run: |
          kanal=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Festgelegt: $kanal"
          rustup toolchain install "$kanal" --profile minimal
          rustup default "$kanal"
          rustc --version

      - name: Zwischenspeicher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/release/bundle
          key: ${{ runner.os }}-auslieferung-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-auslieferung-v1-

      # Vor dem Bauen raeumen -- dieselbe Regel wie in `auslieferung.ps1`:
      # Abgelegt und aufgelistet wird NUR, was dieser Lauf gebaut hat.
      #
      # Bis zum 28.10.2026 fehlte das hier. Der Zwischenspeicher brachte
      # mit `target` die Buendel des vorigen Laufs zurueck, und beim
      # Sprung von 0.1.0 auf 0.1.1 lagen zwei `.deb` nebeneinander. Bemerkt
      # wurde es nur, weil `dpkg-deb` an der zweiten scheiterte -- die
      # Ablage und ihre `pruefsummen.txt` enthielten da schon die alten.
      # Der Speicher laesst die Buendel jetzt aus (oben); geraeumt wird
      # trotzdem, denn aeltere Speicherstaende haben sie noch.
      - name: Alte Bündel räumen
        run: rm -rf target/release/bundle

      - name: Tauri-Werkzeug zwischenspeichern
        id: werkzeug
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI }}

      - name: Tauri-Werkzeug bauen
        if: steps.werkzeug.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "=${{ env.TAURI_CLI }}"

      - name: Abhängigkeiten der Oberfläche
        working-directory: app/oberflaeche
        run: npm ci

      - name: Bündel bauen
        run: cargo tauri build --bundles ${{ matrix.buendel }}

      # Nur macOS: Ist das Bündel versiegelt (Kopf dieser Datei)? Geprüft
      # am Ergebnis, nicht an der Konfiguration -- wie die Signatur in
      # `auslieferung.ps1`. Trägt nur das Programm im Bündel die Signatur,
      # die der Linker auf Apple-Chips von selbst anbringt, scheitert
      # schon `--verify`: Das Bündel drumherum ist dann nicht versiegelt.
      #
      # Kommt eines Tages ein Zertifikat, steht dort statt `adhoc` der
      # Herausgeber -- dann ändert sich diese Prüfung mit.
      - name: Siegel prüfen (nur macOS)
        if: runner.os == 'macOS'
        working-directory: target/release/bundle/macos
        run: |
          codesign --verify --deep --strict --verbose=2 "Cabrik Secure.app"
          siegel=$(codesign --display --verbose=2 "Cabrik Secure.app" 2>&1)
          echo "$siegel"
          grep -q "^Signature=adhoc" <<< "$siegel"
          grep -q "^Sealed Resources version" <<< "$siegel"

      # Nur Linux: Ab welcher glibc startet das Programm? Das bestimmt das
      # Ubuntu dieses Läufers, nicht der Quelltext -- und davon hängt ab,
      # wie alt ein Linux beim Tester sein darf. Gelesen am Programm im
      # `.deb`, also an dem, was Tester bekommen; das AppImage bringt
      # dasselbe Programm mit, aber keine eigene glibc. Die Testerseite
      # nennt diese Zahl.
      - name: Nötige glibc (nur Linux)
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          echo "Gebaut auf: $PRETTY_NAME"
          dpkg-deb -x target/release/bundle/deb/*.deb "$RUNNER_TEMP/deb"
          for programm in "$RUNNER_TEMP"/deb/usr/bin/*; do
            noetig=$(objdump -T "$programm" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1)
            echo "$(basename "$programm") braucht mindestens: $noetig"
          done

      # Dieselbe Rolle wie `pruefsummen.txt` unter Windows: Wer eine Datei
      # weitergereicht bekommt, kann sie gegen das abgleichen, was hier
      # entstanden ist. Gegen Veränderung auf dem Weg hilft das nur, wenn
      # die Summe auf einem anderen Weg ankommt als die Datei.
      #
      # `-exec` und nicht `| xargs`: Die Bündel heißen „Cabrik Secure_…“,
      # mit Leerzeichen, und `xargs` trennt daran. Der erste Lauf scheiterte
      # genau hier — nachdem beide Systeme ihre Bündel fertig gebaut hatten.
      #
      # Zuletzt: Jede Datei trägt die Fassung aus `tauri.conf.json` im
      # Namen. Steht eine andere dabei, ist sie nicht aus diesem Lauf, und
      # ihre Summe gehört nicht in die Liste (siehe „Alte Bündel räumen“).
      - name: Prüfsummen
        working-directory: target/release/bundle
        run: |
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec shasum -a 256 {} + | sort -k 2 > pruefsummen.txt
          cat pruefsummen.txt
          test -s pruefsummen.txt
          fassung=$(jq -r .version "$GITHUB_WORKSPACE/crates/cabrik-fenster/tauri.conf.json")
          if grep -v "_${fassung}_" pruefsummen.txt; then
            echo "::error::Bündel einer anderen Fassung als $fassung (oben) -- nicht aus diesem Lauf"
            exit 1
          fi

      - name: Bündel ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cabrik-secure-${{ matrix.name }}-unsigniert
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/pruefsummen.txt
          if-no-files-found: error
          retention-days: 14
