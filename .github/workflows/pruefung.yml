# Das Tor. Läuft bei jedem Push und jedem Pull Request.
#
# # Warum es das gibt
#
# Weil die einzige Prüfung dieses Projekts bis hierher die Sorgfalt eines
# Menschen am jeweiligen Tag war — und die hat schon versagt: Ein
# `svelte-check` ohne `--tsconfig ./tsconfig.app.json` lässt die
# Testdateien aus, und so sind Typfehler eingecheckt worden, während alle
# Tests grün waren. Deshalb ruft dieses Tor `npm run pruefung` und nichts
# Selbstgebautes: derselbe Befehl, der lokal gilt.
#
# # Warum drei Plattformen
#
# Weil dieser Quelltext nie auf macOS oder Linux übersetzt wurde. Es ist
# damit zu rechnen, dass der erste Lauf etwas findet — `cabrik-shred` fasst
# Dateisysteme an, `cabrik-ablage` Konfigurationspfade. Genau die Stellen,
# an denen Plattformen auseinandergehen.
#
# # Was hier NICHT steht
#
# Die Rust-Fassung. Sie steht in `rust-toolchain.toml` und nirgends sonst;
# `cargo` holt sie sich von dort. Sie hier zu wiederholen hieße, zwei
# Abschriften desselben Gedankens zu führen — und die laufen auseinander.

name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push macht den vorigen Lauf gegenstandslos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Weniger als Lesen braucht dieses Tor nicht. Bei einem
# Verschlüsselungsprogramm ist ein Arbeitsablauf mit Schreibrechten ein
# Angriffsziel: Wer ihn übernimmt, übernimmt das Repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ein Fehlschlag soll die Ursache zeigen, nicht nur die Zeile.
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Nicht abbrechen, wenn eine Plattform scheitert. Beim ersten Lauf
      # will man alle drei Ergebnisse sehen, nicht das erste.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Tauri braucht unter Linux WebKit und GTK; `rfd` zieht GTK3 über
      # `tauri-plugin-dialog` mit herein. Auf Windows und macOS ist das
      # alles im System.
      - name: Systempakete (nur Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `--locked` überall: Der Lauf soll an `Cargo.lock` scheitern, wenn
      # jemand ihn nicht mitgeschickt hat -- statt still eine andere
      # Fassung einer Abhängigkeit zu ziehen als lokal.
      - name: Übersetzen und prüfen
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Darunter läuft auch `vertragsmuster.rs`. Es VERGLEICHT die
      # Prüfmuster mit den eingecheckten, statt sie zu schreiben --
      # `MUSTER_SCHREIBEN` ist hier bewusst nicht gesetzt. Damit ist das
      # der Wächter über den Vertrag zwischen Rust und TypeScript.
      #
      # Und die Korpus-Tests: Was das Fuzzing je gefunden hat, liegt unter
      # `testvectors/fuzz/` und wird bei jedem Lauf erneut geprüft.
      - name: Tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------
  oberflaeche:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Die Fassung steht in `.nvmrc` und nirgends sonst -- dieselbe
          # Regel wie bei Rust: eine Abschrift, nicht zwei.
          node-version-file: app/oberflaeche/.nvmrc
          cache: npm
          cache-dependency-path: app/oberflaeche/package-lock.json

      # `npm ci` und nicht `npm install`: Es hält sich an
      # `package-lock.json` und scheitert, wenn beides nicht zusammenpasst.
      - name: Abhängigkeiten
        working-directory: app/oberflaeche
        run: npm ci

      # Genau der Befehl, der lokal gilt -- svelte-check MIT der richtigen
      # tsconfig und danach vitest. Hier etwas Eigenes hinzuschreiben
      # hieße, zwei Tore zu haben, von denen eines irgendwann nachgibt.
      - name: Typen und Tests
        working-directory: app/oberflaeche
        run: npm run pruefung

  # ---------------------------------------------------------------------
  abhaengigkeiten:
    name: Abhängigkeiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lizenzen, bekannte Sicherheitslücken, unerwünschte Kisten und
      # fremde Quellen. Für ein Programm, dessen Kern quelloffen werden
      # soll, ist die Lizenzprüfung keine Formsache.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
