# Das Hauptgatter: Bauen, Prüfen, Testen — auf Linux, Windows und macOS.
#
# WARUM ALLE DREI. Windows ist das Zielsystem, Linux die Werkbank der
# meisten Werkzeuge. Drei Fehler dieses Projekts wären auf nur einem davon
# unentdeckt geblieben: die Pfadbehandlung in `shred --dir` (Windows), das
# Fuzzing (Linux) — und die Sperrliste für Systemverzeichnisse (macOS), die
# dort das Arbeitsverzeichnis des Benutzers mit erfasste. Ein Werkzeug, das
# nur auf einem System geprüft wird, ist auf den anderen ungeprüft.
#
# WARUM SO WENIGE FREMDE ACTIONS. Dieses Projekt prüft seine
# Rust-Abhängigkeiten mit `cargo deny`. Es wäre widersprüchlich, daneben
# beliebige fremde Actions einzubinden. Benutzt werden nur `actions/checkout`
# und `actions/cache` von GitHub selbst; die Rust-Toolchain kommt über das
# auf den Läufern vorinstallierte `rustup`.
#
# Wer es strenger will, heftet die Actions an ihren Commit-Hash statt an das
# Versionsschild. Das ist die konsequentere Fassung — hier steht bewusst die
# lesbare, damit die Datei ohne Nachschlagen verständlich bleibt.
#
# EINE FALLE FÜR SPÄTER. Wer je eine Plattform aus der Matrix nehmen will,
# kommt mit `exclude` nicht weit: GitHub wendet `include` DANACH an, und ein
# Eintrag, der zu keiner verbliebenen Kombination passt, wird als neue
# hinzugefügt — die eben ausgeschlossene Zeile kommt wieder herein. Genau
# das ist hier passiert, als macOS aus Kostengründen ausgeschlossen werden
# sollte. Dann müssen die Namen aus dem `include` heraus und in einen
# Ausdruck bei `name:`.

name: Prüfung

on:
  push:
    branches: [main]
    # Reine Text- und Bildänderungen brauchen keinen Übersetzer. Ein Lauf
    # ueber drei Plattformen fuer einen geaenderten Satz in der Roadmap
    # kostet rund 180 abgerechnete Minuten und findet nichts.
    paths-ignore:
      - "**.md"
      - "spec/**"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
      - "**/LICENSE"
  pull_request:
  workflow_dispatch:

# Ein neuer Push macht den vorigen Lauf gegenstandslos. Ohne das laufen
# zwei Matrizen parallel weiter, und die aeltere prueft einen Stand, den
# es nicht mehr gibt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Auch auf Windows. Sonst liefe dort PowerShell, und jede Zeile müsste
# zweimal geschrieben werden.
defaults:
  run:
    shell: bash

# Weniger als Lesen braucht dieses Gatter nicht. Bei einem
# Verschlüsselungsprogramm ist ein Arbeitsablauf mit Schreibrechten ein
# Angriffsziel: Wer ihn übernimmt, übernimmt das Repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pruefung:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Ein haengender Lauf soll Minuten kosten, nicht Stunden.
    #
    # GitHubs Grundzeitlimit betraegt sechs Stunden. Genau die hat ein
    # blockierender apt-Prompt einmal verbraucht -- 360 abgerechnete
    # Minuten fuer einen Lauf, der nichts geprueft hat. Das ist ein
    # Fuenftel des Monatskontingents.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    steps:
      - uses: actions/checkout@v4

      # Seit `cabrik-fenster` in der Werkbank ist, zieht `--workspace` auch
      # Tauri herein -- und das braucht unter Linux WebKit und GTK. `rfd`
      # kommt über `tauri-plugin-dialog` mit und verlangt GTK3.
      #
      # Als diese Datei entstand, hatte die Werkbank fünf Kisten und kein
      # Fenster. Sie war nicht falsch, sondern ist stehengeblieben.
      - name: Systempakete (nur Linux)
        if: matrix.os == 'ubuntu-latest'
        # `DEBIAN_FRONTEND=noninteractive` ist kein Beiwerk: Ohne die
        # Angabe kann apt eine Rueckfrage stellen -- etwa ueber neu zu
        # startende Dienste --, und auf einem Laeufer ohne Terminal wartet
        # sie fuer immer. Genau das ist am 18.08.2026 passiert: sechs
        # Stunden bis zum Grundzeitlimit, dann abgebrochen.
        env:
          DEBIAN_FRONTEND: noninteractive
        # Und ein eigenes Limit: Paketquellen koennen langsam sein, aber
        # nicht zehn Minuten lang.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             patchelf             build-essential             file

      # `rust-toolchain.toml` legt 1.97.1 fest. Der Kanal wird von dort
      # gelesen statt fest eingetragen — zwei Stellen für dieselbe Zahl
      # gehen irgendwann auseinander.
      - name: Toolchain
        run: |
          kanal=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Festgelegt: $kanal"
          rustup toolchain install "$kanal" --profile minimal \
            --component rustfmt,clippy
          rustup default "$kanal"
          rustc --version
          cargo --version

      - name: Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # `v2` seit dem 19.08.2026.
          #
          # Der Schluessel haengt an `Cargo.lock`, und die aendert sich
          # selten. Als die Kryptokisten auf `opt-level = 3` umgestellt
          # wurden, brachte der alte Zwischenspeicher weiter die
          # unoptimierten Artefakte mit -- beide Saetze zusammen sprengten
          # die rund 14 GB des Linux-Laeufers, und der Lauf brach mit
          # "No space left on device" ab.
          #
          # Wer ein Bauprofil aendert, erhoeht die Zahl.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      # Freier Platz vor dem Bauen.
      #
      # Ein Laeufer hat rund 14 GB frei, und eine Tauri-Werkbank kommt dem
      # nahe. Als es einmal nicht reichte, meldete der Lauf nur eine
      # Ausnahme aus dem Protokollschreiber -- die eigentliche Ursache
      # stand nirgends. Diese Zeile kostet nichts und beantwortet die
      # Frage sofort.
      - name: Freier Platz
        run: df -h . | tail -1

      # Formatierung zuerst: Sie ist in Sekunden erledigt, und ein Fehlschlag
      # hier erspart die zehn Minuten dahinter.
      - name: Formatierung
        run: cargo fmt --all --check

      # `-D warnings` steht hier und **nicht** in `RUSTFLAGS`. Dort gälte es
      # auch für alle Abhängigkeiten — ein Warnhinweis in fremdem Code
      # brächte den Lauf zum Scheitern, ohne dass jemand ihn beheben könnte.
      # Die eigenen strengen Regeln stehen ohnehin in `Cargo.toml`.
      - name: Clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Die eine Frage, die nur ein echtes Linux oder ein echter Mac
      # beantwortet.
      #
      # `spec/entsperrung.md` §3.4 sagt zu, dass vor dem Ruhezustand
      # gesperrt wird. Unter Linux haengt das an logind, unter macOS an
      # IOKit -- und ob die Anmeldung dort ueberhaupt gelingt, laesst sich
      # auf einem Windows-Rechner nicht herausfinden.
      #
      # Windows ist ausgenommen, weil der dortige Test die Anmeldung
      # ohnehin verlangt: Er schlaegt fehl, wenn sie nicht klappt, und
      # braucht keine zusaetzliche Auskunft. Der Test oben laeuft mit,
      # verlangt aber bewusst keinen bestimmten Ausgang: In einem
      # Behaelter ohne systemd gibt es kein logind, und das ist kein
      # Fehler.
      #
      # Deshalb hier noch einmal mit `--nocapture`. Er kostet Sekunden und
      # beantwortet die Frage, die sonst offen bliebe: Ist der Weg je
      # gegen ein laufendes logind gegangen, oder ist er nur uebersetzt?
      - name: Ruhewacht gegen das echte System
        if: matrix.os != 'windows-latest'
        run: cargo test -p cabrik-speicher --locked ruhezustand -- --nocapture

      # Die Zahlen, die dieses Projekt sonst raten muesste.
      #
      # `entsperrung.md` §3.4 haengt unter macOS an
      # `IORegisterForSystemPower`, und dessen Nachrichtenkonstanten stehen
      # in Apples Kopfdateien. Hier gibt es keinen Mac -- auf diesem
      # Laeufer aber liegt das SDK.
      #
      # Sie aus dem Gedaechtnis hinzuschreiben waere die bequeme Variante
      # und die falsche: Ein geratener Wert meldet entweder nie, dann
      # traegt die Spezifikation eine Zusage ohne Deckung, oder er meldet
      # beim falschen Anlass und sperrt jemanden mitten im Arbeiten aus.
      - name: IOKit-Konstanten gegen Apples Kopfdateien
        if: matrix.os == 'macos-latest'
        run: |
          sdk=$(xcrun --show-sdk-path)
          echo "SDK: $sdk"
          # Nicht unter `usr/include`, sondern im Framework -- so hat es
          # der erste Lauf am 23.08.2026 gezeigt. Der Rueckfall auf `find`
          # bleibt trotzdem stehen: Apple verschiebt so etwas.
          kopf="$sdk/System/Library/Frameworks/IOKit.framework/Versions/A/Headers/IOMessage.h"
          if [ ! -f "$kopf" ]; then
            echo "Nicht am erwarteten Ort: $kopf"
            kopf=$(find "$sdk" -name "IOMessage.h" 2>/dev/null | head -1)
            echo "Stattdessen: $kopf"
          fi
          [ -n "$kopf" ] || exit 0
          echo "--- IOMessage.h ---"
          grep -nE "iokit_common_msg|kIOMessageSystem|kIOMessageCanSystem" "$kopf" || true
          echo "--- sys_iokit / sub_iokit_common ---"
          grep -rnE "define[[:space:]]+sys_iokit|define[[:space:]]+sub_iokit_common"             "$sdk/System/Library/Frameworks/IOKit.framework/Versions/A/Headers/"             2>/dev/null | head -4 || true
          # Und die zwei Makros, die daraus erst eine Zahl machen. Ohne sie
          # bliebe der Grundwert 0xE0000000 eine Erinnerung.
          echo "--- err_system / err_sub ---"
          grep -rnE "define[[:space:]]+err_system|define[[:space:]]+err_sub"             "$sdk/usr/include/mach/error.h" 2>/dev/null | head -4 || true

          # --- Und jetzt der Vergleich ---------------------------------
          #
          # Bis hierher war das eine Auskunft. Ab jetzt ist es eine
          # Pruefung: Die Zahlen stehen in `ruhezustand.rs`, und wenn
          # Apple sie je verschiebt, muss dieser Lauf rot werden -- nicht
          # irgendwann jemandes Mac beim Zuklappen.
          echo "--- Vergleich mit unseren Werten ---"
          fehler=0
          grep -q "kIOMessageSystemWillSleep *iokit_common_msg(0x280)" "$kopf"             || { echo "kIOMessageSystemWillSleep ist nicht mehr 0x280"; fehler=1; }
          grep -q "kIOMessageCanSystemSleep *iokit_common_msg(0x270)" "$kopf"             || { echo "kIOMessageCanSystemSleep ist nicht mehr 0x270"; fehler=1; }
          grep -q "kIOMessageSystemHasPoweredOn *iokit_common_msg(0x300)" "$kopf"             || { echo "kIOMessageSystemHasPoweredOn ist nicht mehr 0x300"; fehler=1; }
          grep -q "kIOMessageSystemWillPowerOn *iokit_common_msg(0x320)" "$kopf"             || { echo "kIOMessageSystemWillPowerOn ist nicht mehr 0x320"; fehler=1; }
          exit $fehler

      # Die Fuzzing-Ziele liegen in einer eigenen Werkbank und würden von
      # `--workspace` nicht erfasst. Gebaut werden sie trotzdem: Ein Ziel,
      # das sich nicht mehr übersetzt, fällt sonst erst beim nächsten
      # nächtlichen Lauf auf — also womöglich in Wochen.
      - name: Fuzzing-Ziele übersetzen
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  # ---------------------------------------------------------------------
  # Die Oberfläche
  #
  # Es gab hier nie einen Job dafür: Als diese Datei entstand, gab es kein
  # Frontend. Inzwischen hängen 409 Tests und die Typprüfung daran -- und
  # der Brückenvertrag zwischen Rust und TypeScript wird dort geprüft.
  #
  # Nur auf Linux: JavaScript-Tests verhalten sich auf drei Läufern gleich,
  # und dreimal `npm ci` kostet Zeit ohne Erkenntnis.
  oberflaeche:
    name: Oberfläche
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # `actions/setup-node` ist von GitHub selbst -- wie `checkout` und
      # `cache`. Der Grundsatz oben bleibt gewahrt.
      - uses: actions/setup-node@v4
        with:
          # Die Fassung steht in `.nvmrc` und nirgends sonst -- dieselbe
          # Regel wie bei Rust: eine Abschrift, nicht zwei.
          node-version-file: app/oberflaeche/.nvmrc
          cache: npm
          cache-dependency-path: app/oberflaeche/package-lock.json

      # `npm ci` und nicht `npm install`: Es hält sich an
      # `package-lock.json` und scheitert, wenn beides nicht zusammenpasst.
      - name: Abhängigkeiten
        working-directory: app/oberflaeche
        run: npm ci

      # Genau der Befehl, der lokal gilt -- svelte-check MIT
      # `--tsconfig ./tsconfig.app.json` und danach vitest. Ohne die
      # tsconfig bleiben die Testdateien ungeprüft, und genau so sind hier
      # schon Typfehler durchgerutscht.
      - name: Typen und Tests
        working-directory: app/oberflaeche
        run: npm run pruefung
