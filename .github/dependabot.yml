# Dependabot — damit veraltete Abhängigkeiten auffallen, bevor sie rot sind.
#
# WARUM. Im Oktober 2026 waren drei geplante Läufe wochenlang rot, und jede
# Ursache war eine Fassung, die sich draußen geändert hatte: Meldungen zu
# Vite, `zip` und `ctutils`, ein neues PyAV. Hier hatte niemand etwas
# angefasst — und niemand hat es gesehen. Dependabot macht aus „draußen hat
# sich etwas geändert“ einen Pull Request, der durch dieselben Prüfungen
# läuft wie jeder andere.
#
# GEBÜNDELT, WÖCHENTLICH. Ein PR je Abhängigkeit hieße bei Tauri Dutzende
# je Woche; sie würden ungelesen zusammengeführt oder ungelesen geschlossen.
# Kleine Sprünge (minor, patch) kommen deshalb als EIN PR je Ökosystem und
# Woche. Große Sprünge kommen einzeln: `zip` 9 brauchte eine Codeänderung,
# und so etwas gehört nicht in einen Sammel-PR.
#
# DIE ACTIONS sind an Commit-Hashes geheftet (`pruefung.yml`, Kopf).
# Dependabot zieht Hash und Fassungskommentar gemeinsam nach.
#
# NICHT HIER: die Python-Werkzeuge der Gegenprobe. Sie stehen absichtlich
# auf `>=`, damit die Gegenprobe merkt, wenn ein fremdes Werkzeug anders
# schreibt (`testvectors/tools/requirements.txt`). Ein Werkzeug, das sie
# festnagelt, nähme ihr genau das.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      rust-klein:
        update-types: [minor, patch]
    # TAURI NUR IM GLEICHSCHRITT. `cargo tauri build` bricht ab, wenn die
    # Kiste `tauri` und das npm-Paket `@tauri-apps/api` nicht auf derselben
    # Haupt- und Nebenfassung stehen („Found version mismatched Tauri
    # packages“). Die Pruefung am Pull Request baut keine Buendel und merkt
    # es deshalb nicht -- erst der naechste Installer.
    #
    # Am 26.10.2026 hob ein npm-Sammel-PR `@tauri-apps/api` auf 2.12,
    # waehrend die Kiste auf 2.11 blieb. Seitdem: Patches laufen durch,
    # eine neue Nebenfassung kommt von Hand -- Kiste, `tauri-build` und
    # `@tauri-apps/api` zusammen, und mit einem Bau der Buendel davor.
    ignore:
      - dependency-name: tauri
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: tauri-build
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Die Fuzzing-Ziele führen eine eigene Werkbank mit eigener Sperrdatei --
  # aber nur EINE eigene Abhängigkeit: `libfuzzer-sys`. Alles andere erben
  # sie über `cabrik-core`, `-metadata` und `-v1` aus der Hauptwerkbank.
  #
  # Deshalb nur diese eine. Der erste Durchlauf am 26.10.2026 zeigte, was
  # sonst geschieht: Dependabot hob „in /fuzz“ die Fassung in der
  # WURZEL-`Cargo.toml` an, schrieb aber nur `fuzz/Cargo.lock` neu. Die
  # Hauptwerkbank stand danach mit einer Sperrdatei da, die nicht mehr zu
  # ihrem Manifest passte, und jedes `--locked` scheiterte. Fünf PRs dieser
  # Art wurden geschlossen.
  #
  # Was das kostet: Hebt ein PR der Wurzel eine Anforderung an (`"0.41"`
  # auf `"0.42"`), muss `fuzz/Cargo.lock` von Hand nachgezogen werden —
  # die Prüfung „Fuzzing-Ziele übersetzen“ sagt, wann.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    allow:
      - dependency-name: libfuzzer-sys

  - package-ecosystem: npm
    directory: /app/oberflaeche
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      oberflaeche-klein:
        update-types: [minor, patch]
    # Die Typen von Node folgen der Node-Fassung, mit der gebaut wird
    # (`.nvmrc`: 24) -- nicht der neuesten. Typen für Node 26 versprächen
    # Schnittstellen, die es beim Bauen nicht gibt. Wer `.nvmrc` anhebt,
    # hebt diese hier von Hand mit an.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Die Gegenseite der Kiste `tauri` -- siehe dort.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
