[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cabrik-secure"
version = "1.0.0"
description = "Cabrik Secure v1 — Referenzimplementierung (eingefroren)"
requires-python = ">=3.10"

# In v1 fehlten diese Angaben vollständig, wodurch `pip install .` ein nicht
# lauffähiges Paket erzeugte. Die Versionen entsprechen dem Stand, mit dem
# v1.0 gebaut und ausgeliefert wurde.
dependencies = [
    "pynacl>=1.5.0",
    "cryptography>=45.0.0",
    "pillow>=11.0.0",
    "piexif>=1.1.3",
    "pikepdf>=9.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15.0"]

# Ebenfalls in v1 nicht vorhanden: ohne diese Einträge sind die CLIs nur über
# `python -m cabrik_secure.cli.<name>` aufrufbar.
[project.scripts]
cabrik-keygen = "cabrik_secure.cli.cabrik_keygen:main"
cabrik-enc = "cabrik_secure.cli.cabrik_enc:main"
cabrik-dec = "cabrik_secure.cli.cabrik_dec:main"
cabrik-meta = "cabrik_secure.cli.cabrik_meta:main"
cabrik-shred = "cabrik_secure.cli.cabrik_shred:main"

[tool.setuptools]
packages = ["cabrik_secure", "cabrik_secure.cli", "cabrik_secure.gui"]
include-package-data = true
