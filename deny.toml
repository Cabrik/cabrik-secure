# Regeln für `cargo deny` — Lizenzen, Schwachstellen, Herkunft.
#
# WOZU DAS HIER GUT IST. Dieses Projekt hat 141 fremde Crates im Baum. Jede
# davon ist Code, den niemand von uns gelesen hat, und jede kann morgen eine
# gemeldete Schwachstelle haben oder ihre Lizenz ändern. Die Prüfung ersetzt
# das Lesen nicht — sie sorgt dafür, dass eine Änderung auffällt.
#
# Aufruf:
#     cargo deny check
#
# ---------------------------------------------------------------------------

[graph]
# Alle Merkmale betrachten, sonst bleiben Abhängigkeiten unsichtbar, die nur
# unter einem Merkmal hereinkommen.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Gemeldete Schwachstellen (RustSec)
# ---------------------------------------------------------------------------

[advisories]
# ---------------------------------------------------------------------------
# Meldungen aus Tauris Abhaengigkeitsbaum
#
# KEINE davon ist eine Verwundbarkeit. Sechzehn Meldungen, alle vom Typ
# `unmaintained` -- also eine Auskunft ueber den Pflegezustand einer Crate,
# nicht ueber einen bekannten Fehler. Nachgeprueft am 2026-08-14:
# `cargo deny check advisories` meldet null Eintraege des Typs
# `vulnerability`.
#
# Sie hier einzutragen ist trotzdem eine Entscheidung und keine
# Formalitaet, deshalb steht je Gruppe, worum es geht.
ignore = [
    # --- GTK3-Bindungen (zehn Eintraege) ------------------------------------
    # Tauri zeichnet unter Linux ueber webkit2gtk, und das haengt an GTK3.
    # Die gtk-rs-Bindungen dafuer sind seit 2024 nicht mehr gepflegt; die
    # Nachfolge (GTK4) ist im Tauri-Umfeld noch nicht vollzogen.
    #
    # Fuer dieses Projekt heisst das: Der Code wird unter Windows und macOS
    # gar nicht uebersetzt -- dort zeichnet WebView2 beziehungsweise WKWebView.
    # Er wird relevant, sobald Linux ein Ziel wird, und DANN ist die Frage
    # neu zu stellen, nicht jetzt zu beantworten.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",

    # --- proc-macro-error ---------------------------------------------------
    # Ein Helfer fuer Fehlermeldungen aus Makros, nur zur BAUZEIT. Er
    # gelangt in kein ausgeliefertes Binaerprogramm.
    "RUSTSEC-2024-0370",

    # --- unic-* (fuenf Eintraege) -------------------------------------------
    # Unicode-Tabellen, ueber `urlpattern` an `tauri-utils` haengend, und
    # ebenfalls nur zur Bauzeit. Unwartet heisst hier vor allem: Die
    # Tabellen bilden einen aelteren Unicode-Stand ab.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

# WANN DAS NEU ZU PRUEFEN IST
#
# 1. Sobald Linux ein Ziel wird -- dann werden die GTK3-Eintraege von einer
#    Fussnote zu einer Aussage ueber ausgelieferten Code.
# 2. Bei jedem groesseren Tauri-Sprung: Faellt eine der Crates aus dem
#    Baum, gehoert ihr Eintrag hier heraus. Eine Ausnahme, die niemanden
#    mehr betrifft, verdeckt beim naechsten Mal eine echte.

# Sobald hier eine Ausnahme steht, gehört eine Begründung mit Datum daneben
# — eine Ausnahme ohne Begründung ist nach drei Monaten niemandem mehr
# erklärbar.

# ---------------------------------------------------------------------------
# Lizenzen
# ---------------------------------------------------------------------------
#
# Das Ziel ist nicht Reinheit, sondern eine Eigenschaft: **Das Programm muss
# sich kommerziell weitergeben lassen**, ohne den eigenen Quelltext
# offenlegen zu müssen. Deshalb sind alle freizügigen Lizenzen erlaubt und
# alle Copyleft-Lizenzen nicht aufgeführt — was nicht dasteht, ist verboten.
#
# Stand der Prüfung: kein GPL, AGPL oder reines LGPL im Baum.

[licenses]
# MPL-2.0 ist die einzige Lizenz in diesem Baum, die anders wirkt als
# MIT/Apache -- deshalb steht sie hier mit Begruendung und nicht bloss in
# der Liste.
#
# WAS SIE VERLANGT. Sie ist DATEIWEISES Copyleft: Wer eine MPL-Datei
# aendert, muss die geaenderte Datei unter MPL veroeffentlichen. Das
# Einbinden in ein groesseres Werk -- auch ein unfreies -- erlaubt §3.3
# ausdruecklich. Genau dafuer ist sie gebaut; Mozilla verwendet sie fuer
# Bausteine, die in fremde Programme wandern.
#
# WAS DAS HIER HEISST. Fuenf Crates aus Tauris Baum stehen unter MPL-2.0:
# cssparser, cssparser-macros, selectors, dtoa-short (ueber tauri-utils)
# und option-ext (ueber dirs). Keine davon wird von diesem Projekt
# veraendert -- es gibt kein vendor-Verzeichnis und keinen [patch]-Eintrag.
# Die Pflicht beschraenkt sich damit auf das, was ohnehin gilt:
# Lizenztexte mitliefern und die Herkunft nennen.
#
# WANN DAS NEU ZU PRUEFEN IST. Sobald eine dieser Crates eingebunden und
# angepasst wird. Dann entsteht eine Veroeffentlichungspflicht fuer die
# geaenderten Dateien, und die ist mit einer kommerziellen Verwertung nur
# vereinbar, wenn man sie kennt.
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    # Zeichensatztabellen aus dem Unicode-Konsortium. Freizügig, aber eine
    # eigene Lizenz — sie muss ausdrücklich dastehen.
    "Unicode-3.0",
    # Öffentlich freigegeben, kommt bei Krypto-Testvektoren vor.
    "CC0-1.0",
]

# Unter dieser Sicherheit gilt eine Lizenzangabe als unklar und die Prüfung
# schlägt fehl, statt zu raten.
confidence-threshold = 0.9

# Die eigenen unveröffentlichten Kisten aus der Prüfung nehmen.
#
# # Warum das nötig wurde
#
# Weil `cabrik-app`, `-bruecke`, `-cli`, `-fenster` und `-v1` seit der
# Aufteilung `LicenseRef-Cabrik-Proprietary` tragen. SPDX kennt keinen
# Bezeichner für „proprietär"; `LicenseRef-` ist die dafür vorgesehene
# Form, und `cargo deny` weist sie zu Recht ab, weil sie in keiner Liste
# steht.
#
# # Warum das trotzdem kein Loch reißt
#
# `ignore` greift **nur** bei Kisten mit `publish = false` — also genau
# bei denen, die diese Werkbank selbst enthält und die nie auf crates.io
# landen. Fremde Abhängigkeiten bleiben vollständig geprüft, und eine
# eigene Kiste, bei der jemand `publish = false` vergisst, fällt hier
# wieder auf.
#
# Die vier quelloffenen stehen bewusst NICHT hier: Sie sagen
# `Apache-2.0`, und das gehört geprüft wie alles andere auch.
[licenses.private]
ignore = true

# ---------------------------------------------------------------------------
# Was nicht hereinkommen darf
# ---------------------------------------------------------------------------

[bans]
# Mehrere Fassungen derselben Crate sind unschön, aber im RustCrypto-Umfeld
# gerade unvermeidlich: `ml-kem` und `sha3` sind schon auf `digest 0.11`,
# andere noch auf `0.10`. Das ist ein Zustand des Ökosystems, kein Fehler
# dieses Projekts — deshalb Hinweis statt Abbruch.
multiple-versions = "warn"

# Eine Abhängigkeit mit `*` als Fassung ist eine offene Tür — bei einer
# Crate aus der Registrierung. Innerhalb der eigenen Werkbank ist sie das
# Gegenteil: Dort verweist der Pfad unmittelbar auf den Quelltext daneben,
# und eine Fassungsangabe wäre nur Zierde.
wildcards = "deny"
allow-wildcard-paths = true

# Merkmale, die niemand gefordert hat, sind Angriffsfläche.
external-default-features = "allow"

# --- Kaputte Primitive ---------------------------------------------------
#
# Keines davon hat in einem Kryptopfad etwas zu suchen. Sie stehen hier
# **vorbeugend**: Sie sollen nicht eines Tages über eine neue Abhängigkeit
# hereinrutschen, ohne dass es jemandem auffällt.

[[bans.deny]]
name = "sha1"

[[bans.deny]]
name = "sha-1"

[[bans.deny]]
name = "rc4"

[[bans.deny]]
name = "des"

# MD5 ist gebrochen — und trotzdem im Baum. Grund: Die PDF-Norm schreibt ihn
# für ihre eigene Alt-Verschlüsselung vor, und `lopdf` setzt sie um. Er liegt
# damit **außerhalb** unseres Kryptopfads.
#
# Die Ausnahme ist auf `lopdf` beschränkt. Käme MD5 morgen über einen anderen
# Weg herein — etwa weil jemand ihn im Kern benutzt —, schlüge die Prüfung an.
[[bans.deny]]
name = "md-5"
wrappers = ["lopdf"]

# --- Fremde Kryptobibliotheken -------------------------------------------
#
# Der Kern soll reines Rust bleiben, damit er sich per UniFFI nach iOS und
# Android bringen lässt und `forbid(unsafe_code)` überhaupt einhaltbar ist.
# Eine C-Bibliothek dahinter machte beides zunichte.

[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "openssl-sys"

[[bans.deny]]
name = "native-tls"

# ---------------------------------------------------------------------------
# Herkunft
# ---------------------------------------------------------------------------
#
# Alles kommt aus der öffentlichen Registrierung. Eine Abhängigkeit
# unmittelbar aus einem Git-Zweig wäre nicht reproduzierbar und könnte sich
# unter uns ändern.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
