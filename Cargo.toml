[workspace]
resolver = "3"
members = [
    "crates/cabrik-ablage",
    "crates/cabrik-app",
    "crates/cabrik-bruecke",
    "crates/cabrik-cli",
    "crates/cabrik-fenster",
    "crates/cabrik-core",
    "crates/cabrik-metadata",
    "crates/cabrik-shred",
    "crates/cabrik-speicher",
    "crates/cabrik-v1",
]
# Die Fuzzing-Ziele bilden eine eigene Werkbank: Sie brauchen nightly und
# den Adresspruefer, waehrend hier 1.97.1 festgenagelt ist.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/Cabrik/cabrik-secure"

# KEIN `license` hier, und das ist Absicht.
#
# Diese Werkbank enthaelt zweierlei: fuenf Kisten, die quelloffen werden,
# und fuenf, die es nicht werden. Eine geerbte Angabe traefe alle zehn --
# und erklaerte damit auch das Fenster und die CLI zu Apache-2.0, obwohl
# das nie gewollt war. Genau das stand hier bis eben.
#
# Eine Lizenzangabe ist eine Zusicherung an jeden, der den Quelltext in
# die Hand bekommt. Sie versehentlich zu erteilen ist nicht
# zurueckzunehmen: Wer eine Fassung unter Apache-2.0 erhalten hat, darf
# sie weiter unter Apache-2.0 nutzen, auch wenn es spaeter anders
# dasteht.
#
# Deshalb sagt es jede Kiste selbst:
#
#   quelloffen (Apache-2.0):
#     cabrik-core, cabrik-metadata, cabrik-shred, cabrik-ablage,
#     cabrik-speicher
#
#   nicht quelloffen (LicenseRef-Cabrik-Proprietary):
#     cabrik-app, cabrik-bruecke, cabrik-cli, cabrik-fenster, cabrik-v1
#
# Die fuenf offenen bilden einen geschlossenen Teilgraphen: `-metadata` und
# `-shred` haengen an `-core`, `-ablage` und `-speicher` an keiner eigenen,
# und keine von ihnen an einer proprietaeren. Sie lassen sich also fuer
# sich bauen und veroeffentlichen -- was die Bedingung dafuer ist, dass die
# Sicherheitsaussagen dieses Programms ueberpruefbar werden.
#
# (`-speicher` kam spaeter dazu. Diese Zaehlung sprach bis zum 26.10.2026
# noch von vier; `tests/gleichlauf.rs` in jener Kiste prueft die Liste
# der offenen Kisten, der Kommentar hier hatte niemanden, der ihn prueft.)

[workspace.dependencies]
# Die eigenen Crates. Pfad UND Fassung: Der Pfad gilt beim Bauen hier, die
# Fassung waere beim Veroeffentlichen noetig -- ohne sie ist die Abhaengigkeit
# formal eine Wildcard, und `cargo deny` sagt das zu Recht.
cabrik-ablage = { path = "crates/cabrik-ablage", version = "0.1.0" }
cabrik-app = { path = "crates/cabrik-app", version = "0.1.0" }
cabrik-bruecke = { path = "crates/cabrik-bruecke", version = "0.1.0" }
cabrik-core = { path = "crates/cabrik-core", version = "0.1.0" }
cabrik-metadata = { path = "crates/cabrik-metadata", version = "0.1.0" }
cabrik-shred = { path = "crates/cabrik-shred", version = "0.1.0" }
cabrik-speicher = { path = "crates/cabrik-speicher", version = "0.1.0" }
cabrik-v1 = { path = "crates/cabrik-v1", version = "0.1.0" }

sha2 = "0.11"
hkdf = "0.13"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

# Nur fuer `cabrik-speicher`, und dort nur fuer vier Systemaufrufe:
# mlock/munlock beziehungsweise VirtualLock/VirtualUnlock samt Seitengroesse.
#
# Beide liegen ohnehin schon im Baum -- Tauri zieht sie ueber `tao` herein.
# Sie zu benutzen kostet also kein zusaetzliches Vertrauen, sondern nutzt,
# was bereits geprueft werden muss.
libc = "0.2"
# Nur unter Linux, nur fuer logind -- liegt ueber Tauri ohnehin im Baum.
zbus = "5.9"
windows-sys = "0.61"
serde = { version = "1", features = ["derive"] }
# TAURI NUR IM GLEICHSCHRITT -- mit `@tauri-apps/api` in
# `app/oberflaeche/package.json`. `cargo tauri build` bricht ab, wenn Kiste
# und npm-Paket nicht auf derselben Haupt- und Nebenfassung stehen.
#
# Deshalb stehen hier Untergrenzen statt eines blossen "2": Die Rust-Seite
# darf nie unter die Nebenfassung der npm-Seite rutschen -- auch nicht
# durch ein `cargo update`, das an anderer Stelle Platz schaffen will. Wer
# Tauri anhebt, hebt diese vier und `@tauri-apps/api` zusammen an
# (`.github/dependabot.yml` laesst dafuer nur Patches automatisch durch).
#
# `tauri-build` zaehlt eigene Fassungen: 2.7 gehoert zu Tauri 2.12. Die
# Plugins ebenso; ihre Nebenfassungen verlangen jeweils eine bestimmte
# Tauri-Nebenfassung und ziehen sie sonst unbemerkt mit (so geschehen am
# 26.10.2026, Dependabot-PR #22).
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
# Nur fuer das Meldungsfenster, wenn Tauri selbst nicht startet -- ohne
# Fenster gibt es sonst gar keine Moeglichkeit, etwas zu sagen. Kommt
# ohnehin schon mit tauri-plugin-dialog herein.
rfd = { version = "0.16", default-features = false }
# Nur die Modulmatrix -- die Bild- und SVG-Zusatzteile ziehen `image`
# nach und werden nicht gebraucht: Den Pfad zeichnen wir selbst.
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
# `zeroize`, damit `argon2::Block` sich ueberschreiben laesst. Die Kiste
# selbst loescht damit nur ihre kleinen Zwischenwerte -- den eigentlichen
# Arbeitsspeicher legt `cabrik_core::keyfile::argon2id` selbst an und
# ueberschreibt ihn auch selbst. Das gilt auch ab 0.6: Dort legt die Kiste
# zwar fehlbar an, gibt den Speicher aber weiterhin ungeloescht frei.
#
# Ohne Vorgabemerkmale: Sie braechten `password-hash` (das PHC-Format fuer
# Passwortdatenbanken) und `getrandom` herein. Der Kern braucht beides
# nicht -- er reicht Speicher und Salz selbst hinein.
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
hpke = "0.14"
rand_core = "0.10"
ed25519-dalek = "3"
x25519-dalek = "3"
base64 = "0.22"
# Nur für die deterministische Zufallsquelle unter dem Feature `testing`.
chacha20 = "0.10"

# Nur für cabrik-metadata.
#
# `zip` bewusst ohne Vorgabemerkmale: OOXML und ODF verwenden ausschließlich
# `store` und `deflate`. Bzip2, LZMA, zstd, XZ, PPMd und AES wären zusätzliche
# Parser-Angriffsfläche ohne jeden Nutzen — und Parser sind in einem
# Sicherheitswerkzeug die teuerste Art von Abhängigkeit.
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# PDF. Ohne Vorgabemerkmale: kein chrono, jiff, rayon, time, image, tokio.
lopdf = { version = "0.44", default-features = false }

# Für alle Crates verbindlich. Siehe crates/README.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Arithmetik, die stillschweigend überläuft oder abstürzt, ist in einem
# Krypto-Kern nicht akzeptabel — sie wird zum Fehler, nicht zur Warnung.
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
missing_panics_doc = "warn"
must_use_candidate = "warn"

# Die Kryptokisten auch im Testbau optimieren.
#
# # Warum
#
# Argon2 ist mit Absicht teuer, und im unoptimierten Bau ist es zusätzlich
# um ein Vielfaches langsamer. Die Tests dieses Projekts leiten dutzendfach
# echte Schlüssel ab — auf dem Windows-Läufer der CI verbrachte
# `cargo test` fünfzehn Minuten damit.
#
# Optimiert werden AUSGEWÄHLTE Kisten, nicht alle.
#
# # Warum nicht `package."*"`
#
# Das war der erste Versuch und ging schief: Der Linux-Läufer der CI
# brach mit „No space left on device" ab. Jede Abhängigkeit einer
# Tauri-Werkbank optimiert zu übersetzen sprengt die rund 14 GB, die dort
# frei sind — zumal der Zwischenspeicher die unoptimierten Artefakte des
# vorigen Laufs mitbringt.
#
# Gebraucht wird die Optimierung ohnehin nur dort, wo gerechnet wird. Die
# Liste ist kurz, und der Gewinn bleibt fast vollständig erhalten.
#
# # Warum an `dev` und nicht an `test`
#
# Weil `test` von `dev` erbt. Stünde es nur unter `[profile.test]`, baute
# Cargo diese Kisten **zweimal**.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3

[profile.release]
overflow-checks = true    # auch im Release: lieber Abbruch als stiller Überlauf
